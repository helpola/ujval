<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Screener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Stock Screener Dashboard</h1>
        <p>Analyze stocks with advanced filters and insights.</p>
    </header>
    <main>
        <div class="filter-container">
            <div class="filter-group">
                <label for="headingFilter">Filter by Heading:</label>
                <select id="headingFilter">
                    <option value="all">All</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="valuationFilter">Valuation:</label>
                <select id="valuationFilter">
                    <option value="all">All</option>
                    <option value="overvalued">Overvalued</option>
                    <option value="undervalued">Undervalued</option>
                </select>
            </div>
        </div>
        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr id="tableHeader">
                        <!-- Dynamic Headers -->
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Stock Screener. All rights reserved.</p>
        <p class="disclaimer">
            Investments in the stock market are subject to risks. Please consult your financial advisor before investing.
        </p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
