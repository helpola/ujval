<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpola Stock Screener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Helpola Stock Screener</h1>
    </header>
    <main>
        <div class="filter-container">
            <label for="stockDropdown">Select Stock:</label>
            <select id="stockDropdown">
                <option value="none" selected disabled>Choose a stock</option>
            </select>
        </div>
        <div id="stockDetails" class="stock-details"></div>
        <div class="button-container">
            <button id="undervaluedButton" class="action-button">Find Under Valued Stocks</button>
            <button id="overvaluedButton" class="action-button">Find Over Valued Stocks</button>
        </div>
        <div id="stockList" class="stock-list"></div>
    </main>
    <footer>
        <p>&copy; 2025 Helpola Stock Screener. All rights reserved.</p>
        <p class="disclaimer">Investing in the stock market involves risk. Consult a financial advisor before making decisions.</p>
    </footer>
    <audio id="clickSound" src="click.mp3"></audio>
    <script src="script.js"></script>
</body>
</html>
