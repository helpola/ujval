<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Data Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Stock Market Dashboard</h1>
    </header>
    <main>
        <div class="filter-container">
            <label for="filterDropdown">Filter By:</label>
            <select id="filterDropdown">
                <option value="all">All</option>
                <!-- Options will be dynamically populated -->
            </select>
        </div>
        <table id="dataTable">
            <thead>
                <tr id="tableHeader">
                    <!-- Headers will load dynamically -->
                </tr>
            </thead>
            <tbody>
                <!-- Data will load dynamically -->
            </tbody>
        </table>
    </main>

    <!-- Modal for Stock Details -->
    <div id="stockModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Stock Details</h2>
            <div id="stockDetails"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Stock Market Dashboard. All rights reserved.</p>
        <p class="disclaimer">
            Stock trading involves risks. Please do your own research before making any investment decisions.
        </p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
